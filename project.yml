name: flow
options:
  bundleIdPrefix: dev.thetinygoat
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    OTHER_LDFLAGS: -lstdc++
targets:
  flow:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Vendor/GhosttyResources/terminfo
        type: folder
      - path: Vendor/GhosttyResources/ghostty
        type: folder
    dependencies:
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: flow
        CFBundleDisplayName: flow
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.thetinygoat.flow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: ""
    scheme:
      testTargets:
        - flowTests
  flowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Logger.swift
      - path: Sources/Workspace/PaneTree.swift
      - path: Sources/Workspace/Workspace.swift
      - path: Sources/Workspace/Session.swift
      - path: Sources/Workspace/GitStatus.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.thetinygoat.flowTests
        GENERATE_INFOPLIST_FILE: YES
