name: flow
options:
  bundleIdPrefix: dev.thetinygoat
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    OTHER_LDFLAGS: -lstdc++
    DEAD_CODE_STRIPPING: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  flow:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Resources/Assets.xcassets
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
      - path: Vendor/GhosttyResources/terminfo
        type: folder
      - path: Vendor/GhosttyResources/ghostty
        type: folder
      - path: Resources/shell-integration
        type: folder
      - path: Resources/agents
        type: folder
    dependencies:
      - target: flw
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      - package: Sparkle
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: $(FLOW_DISPLAY_NAME)
        CFBundleDisplayName: $(FLOW_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.developer-tools
        SUFeedURL: https://github.com/thetinygoat/flow/releases/latest/download/appcast.xml
        SUPublicEDKey: gnIDTAWHUnqS4UrhHqvKEcvSXQvgKEp1MBuzvlSeFsM=
        # Programs run inside Flow are attributed to Flow by macOS, so their
        # permission prompts show these.
        NSAppleEventsUsageDescription: A program running in Flow would like to use AppleScript.
        NSBluetoothAlwaysUsageDescription: A program running in Flow would like to use Bluetooth.
        NSCalendarsUsageDescription: A program running in Flow would like to access your calendars.
        NSCameraUsageDescription: A program running in Flow would like to use the camera.
        NSContactsUsageDescription: A program running in Flow would like to access your contacts.
        NSLocalNetworkUsageDescription: A program running in Flow would like to access the local network.
        NSLocationUsageDescription: A program running in Flow would like to access your location.
        NSMicrophoneUsageDescription: A program running in Flow would like to use the microphone.
        NSMotionUsageDescription: A program running in Flow would like to access motion data.
        NSPhotoLibraryUsageDescription: A program running in Flow would like to access your photos.
        NSRemindersUsageDescription: A program running in Flow would like to access your reminders.
        NSSpeechRecognitionUsageDescription: A program running in Flow would like to use speech recognition.
        NSSystemAdministrationUsageDescription: A program running in Flow requires administrator privileges.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folders
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.directory]
        NSServices:
          - NSMenuItem:
              default: New Flow Workspace Here
            NSMessage: openWorkspace
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendTypes: [NSFilenamesPboardType, public.plain-text]
          - NSMenuItem:
              default: New Flow Window Here
            NSMessage: openWindow
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendTypes: [NSFilenamesPboardType, public.plain-text]
    settings:
      base:
        PRODUCT_NAME: Flow
        # Placeholders; the stamp-version script writes the real values from git.
        MARKETING_VERSION: 0.0.0
        CURRENT_PROJECT_VERSION: "0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.thetinygoat.flow
        FLOW_DISPLAY_NAME: Flow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Resources/Flow.entitlements
      configs:
        # The hardened runtime only loads libraries signed by the app's own
        # team, so Debug is signed with the team too rather than ad-hoc.
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: DP5STKBRSS
          # A debug build running beside the installed Flow is a separate app to
          # macOS, so neither steals the other's activation or Dock entry.
          PRODUCT_BUNDLE_IDENTIFIER: dev.thetinygoat.flow.debug
          FLOW_DISPLAY_NAME: Flow Debug
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
          DEVELOPMENT_TEAM: DP5STKBRSS
          OTHER_CODE_SIGN_FLAGS: --timestamp
          # Notarization rejects the debugging entitlement Xcode adds by default.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    postBuildScripts:
      - name: Stamp version
        script: '"$SRCROOT/scripts/stamp-version.sh"'
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - flowTests
  flw:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tools/flw
      - path: Sources/Agent/Shared
    settings:
      base:
        PRODUCT_NAME: flw
        PRODUCT_BUNDLE_IDENTIFIER: dev.thetinygoat.flow.flw
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: DP5STKBRSS
        Release:
          CODE_SIGN_IDENTITY: Developer ID Application
          DEVELOPMENT_TEAM: DP5STKBRSS
          OTHER_CODE_SIGN_FLAGS: --timestamp
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  flowTests:
    type: bundle.unit-test
    platform: macOS
    dependencies:
      - target: flw
        embed: false
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
    sources:
      - path: Tests
      - path: Sources/Logger.swift
      - path: Sources/AppFolder.swift
      - path: Sources/UI/CommandPalette.swift
      - path: Sources/UI/CommandPaletteView.swift
      - path: Sources/Workspace/PaneTree.swift
      - path: Sources/Workspace/Workspace.swift
      - path: Sources/Workspace/Session.swift
      - path: Sources/Workspace/TerminalModel.swift
      - path: Sources/Agent
      - path: Sources/Workspace/GitStatus.swift
      - path: Sources/Ghostty
      - path: Sources/Settings/ConfigSetting.swift
      - path: Sources/Settings/Preferences.swift
      - path: Sources/Settings/SettingsStore.swift
      - path: Sources/Settings/Themes.swift
      - path: Sources/ServiceProvider.swift
      - path: Sources/UI/ClipboardConfirmation.swift
      - path: Sources/UI/UntrustedLinkAlert.swift
      - path: Sources/UI/LinkPreviewView.swift
      - path: Sources/UI/SearchBarView.swift
      - path: Sources/UI/PaneTreeView.swift
      - path: Sources/UI/TerminalScrollbar.swift
      - path: Sources/UI/WindowContentViewController.swift
      - path: Sources/UI/WorkspaceMenu.swift
      - path: Sources/UI/RowDrop.swift
      - path: Sources/UI/TabBarView.swift
      - path: Sources/UI/AgentDotView.swift
      - path: Sources/UI/KeyboardShortcuts.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.thetinygoat.flowTests
        GENERATE_INFOPLIST_FILE: YES
