name: flow
options:
  bundleIdPrefix: dev.thetinygoat
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    OTHER_LDFLAGS: -lstdc++
targets:
  flow:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Vendor/GhosttyResources/terminfo
        type: folder
      - path: Vendor/GhosttyResources/ghostty
        type: folder
    dependencies:
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Flow
        CFBundleDisplayName: Flow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSServices:
          - NSMenuItem:
              default: New Flow Workspace Here
            NSMessage: openWorkspace
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendTypes: [NSFilenamesPboardType, public.plain-text]
          - NSMenuItem:
              default: New Flow Window Here
            NSMessage: openWindow
            NSRequiredContext:
              NSTextContent: FilePath
            NSSendTypes: [NSFilenamesPboardType, public.plain-text]
    settings:
      base:
        PRODUCT_NAME: Flow
        # Placeholders; the stamp-version script writes the real values from git.
        MARKETING_VERSION: 0.0.0
        CURRENT_PROJECT_VERSION: "0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: dev.thetinygoat.flow
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: ""
    postBuildScripts:
      - name: Stamp version
        script: '"$SRCROOT/scripts/stamp-version.sh"'
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - flowTests
  flowTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Logger.swift
      - path: Sources/Workspace/PaneTree.swift
      - path: Sources/Workspace/Workspace.swift
      - path: Sources/Workspace/Session.swift
      - path: Sources/Workspace/GitStatus.swift
      - path: Sources/Ghostty/ConfigFile.swift
      - path: Sources/Ghostty/CommandFinish.swift
      - path: Sources/ServiceProvider.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.thetinygoat.flowTests
        GENERATE_INFOPLIST_FILE: YES
